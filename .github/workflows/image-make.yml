name: Image Make

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: build, release, or build-and-release
        required: true
        default: build-and-release
        type: choice
        options: [build, release, build-and-release]
      tag:
        description: Image tag and GitHub Release tag
        required: true
        default: 1.0.0
        type: string
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64
        type: string
      build_image:
        description: Build the Docker image
        required: true
        default: true
        type: boolean
      target_image_amd64:
        description: Primary amd64 image name without tag
        required: true
        default: registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-promtail-vlogs-mongodb-amd64
        type: string
      target_image_arm64:
        description: Primary arm64 image name without tag
        required: true
        default: registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-promtail-vlogs-mongodb-arm64
        type: string
      push_registry:
        description: Push image to the primary registry
        required: true
        default: true
        type: boolean
      push_aliyun:
        description: Push image to the Aliyun registry
        required: true
        default: false
        type: boolean
      aliyun_image_amd64:
        description: Aliyun amd64 image name without tag
        required: true
        default: ''
        type: string
      aliyun_image_arm64:
        description: Aliyun arm64 image name without tag
        required: true
        default: ''
        type: string
      create_release:
        description: Create GitHub Release packages
        required: true
        default: true
        type: boolean
      notify_hap:
        description: Notify HAP Webhook after Release
        required: true
        default: false
        type: boolean

env:
  WORKFLOW_OPERATION: ${{ github.event_name == 'push' && 'build-and-release' || inputs.operation }}
  WORKFLOW_TAG: ${{ github.event_name == 'push' && (vars.IMAGE_TAG || '1.0.0') || inputs.tag }}
  WORKFLOW_PLATFORMS: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || inputs.platforms }}
  WORKFLOW_TARGET_IMAGE_AMD64: ${{ github.event_name == 'push' && 'registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-promtail-vlogs-mongodb-amd64' || inputs.target_image_amd64 }}
  WORKFLOW_TARGET_IMAGE_ARM64: ${{ github.event_name == 'push' && 'registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-promtail-vlogs-mongodb-arm64' || inputs.target_image_arm64 }}
  WORKFLOW_ALIYUN_IMAGE_AMD64: ${{ github.event_name == 'push' && '' || inputs.aliyun_image_amd64 }}
  WORKFLOW_ALIYUN_IMAGE_ARM64: ${{ github.event_name == 'push' && '' || inputs.aliyun_image_arm64 }}
  WORKFLOW_BUILD_IMAGE: ${{ github.event_name == 'push' && 'true' || inputs.build_image }}
  WORKFLOW_PUSH_REGISTRY: ${{ github.event_name == 'push' && 'true' || inputs.push_registry }}
  WORKFLOW_PUSH_ALIYUN: ${{ github.event_name == 'push' && 'true' || inputs.push_aliyun }}
  WORKFLOW_CREATE_RELEASE: ${{ github.event_name == 'push' && 'true' || inputs.create_release }}
  WORKFLOW_NOTIFY_HAP: ${{ github.event_name == 'push' && 'true' || inputs.notify_hap }}
  REGISTRY: ${{ vars.REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || secrets.ALIYUN_REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.ALIYUN_REGISTRY_PASSWORD }}
  HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
  HAP_WEBHOOK_APP_KEY: ${{ secrets.HAP_WEBHOOK_APP_KEY }}
  HAP_WEBHOOK_SIGN: ${{ secrets.HAP_WEBHOOK_SIGN }}
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  config:
    name: Check module configuration
    runs-on: ubuntu-24.04
    outputs:
      can_primary: ${{ steps.check.outputs.can_primary }}
      can_aliyun: ${{ steps.check.outputs.can_aliyun }}
      can_build: ${{ steps.check.outputs.can_build }}
      can_package: ${{ steps.check.outputs.can_package }}
      can_release: ${{ steps.check.outputs.can_release }}
    steps:
      - id: check
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USERNAME: ${{ env.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ env.REGISTRY_PASSWORD }}
          ALIYUN_REGISTRY: ${{ env.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
          TARGET_IMAGE_AMD64: ${{ env.WORKFLOW_TARGET_IMAGE_AMD64 }}
          TARGET_IMAGE_ARM64: ${{ env.WORKFLOW_TARGET_IMAGE_ARM64 }}
          ALIYUN_IMAGE_AMD64: ${{ env.WORKFLOW_ALIYUN_IMAGE_AMD64 }}
          ALIYUN_IMAGE_ARM64: ${{ env.WORKFLOW_ALIYUN_IMAGE_ARM64 }}
          PUSH_REGISTRY: ${{ env.WORKFLOW_PUSH_REGISTRY }}
          PUSH_ALIYUN: ${{ env.WORKFLOW_PUSH_ALIYUN }}
          BUILD_IMAGE: ${{ env.WORKFLOW_BUILD_IMAGE }}
          CREATE_RELEASE: ${{ env.WORKFLOW_CREATE_RELEASE }}
          HAP_WEBHOOK_URL: ${{ env.HAP_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import os

          def enabled(name):
              return os.environ.get(name, '').lower() == 'true'

          primary = enabled('PUSH_REGISTRY') and all(os.environ.get(k, '').strip() for k in ('REGISTRY', 'REGISTRY_USERNAME', 'REGISTRY_PASSWORD', 'TARGET_IMAGE_AMD64', 'TARGET_IMAGE_ARM64'))
          aliyun = enabled('PUSH_ALIYUN') and all(os.environ.get(k, '').strip() for k in ('ALIYUN_REGISTRY', 'ALIYUN_USERNAME', 'ALIYUN_PASSWORD', 'ALIYUN_IMAGE_AMD64', 'ALIYUN_IMAGE_ARM64'))
          source = primary or aliyun
          can_build = enabled('BUILD_IMAGE') and source
          can_package = enabled('CREATE_RELEASE') and source
          can_release = can_package
          reasons = []
          primary_missing = [k for k in ('REGISTRY', 'REGISTRY_USERNAME', 'REGISTRY_PASSWORD', 'TARGET_IMAGE_AMD64', 'TARGET_IMAGE_ARM64') if not os.environ.get(k, '').strip()]
          aliyun_missing = [k for k in ('ALIYUN_REGISTRY', 'ALIYUN_USERNAME', 'ALIYUN_PASSWORD', 'ALIYUN_IMAGE_AMD64', 'ALIYUN_IMAGE_ARM64') if not os.environ.get(k, '').strip()]
          if enabled('PUSH_REGISTRY') and not primary:
              reasons.append('Primary registry skipped; missing: ' + ', '.join(primary_missing))
          if enabled('PUSH_ALIYUN') and not aliyun:
              reasons.append('Aliyun registry skipped; missing: ' + ', '.join(aliyun_missing))
          if not source:
              reasons.append('Build/package skipped: no usable image registry is configured.')
          if enabled('CREATE_RELEASE') and source:
              reasons.append('GitHub Release: enabled.')
          if os.environ.get('HAP_WEBHOOK_URL', '').strip():
              reasons.append('HAP Webhook: configured and will be notified after Release.')
          else:
              reasons.append('HAP Webhook skipped: HAP_WEBHOOK_URL is missing.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Module configuration\n\n')
              f.write('\n'.join(f'- {item}' for item in reasons) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'can_primary={str(primary).lower()}\n')
              f.write(f'can_aliyun={str(aliyun).lower()}\n')
              f.write(f'can_build={str(can_build).lower()}\n')
              f.write(f'can_package={str(can_package).lower()}\n')
              f.write(f'can_release={str(can_release).lower()}\n')
          PY

  build:
    needs: config
    if: ${{ needs.config.outputs.can_build == 'true' && (github.event_name == 'push' || inputs.operation != 'release') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to registry
        if: ${{ needs.config.outputs.can_primary == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Login to Aliyun registry
        if: ${{ needs.config.outputs.can_aliyun == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
      - name: Build and push architecture image
        env:
          TARGET_IMAGE: ${{ matrix.architecture == 'amd64' && env.WORKFLOW_TARGET_IMAGE_AMD64 || env.WORKFLOW_TARGET_IMAGE_ARM64 }}:${{ env.WORKFLOW_TAG }}
          ALIYUN_IMAGE: ${{ matrix.architecture == 'amd64' && env.WORKFLOW_ALIYUN_IMAGE_AMD64 || env.WORKFLOW_ALIYUN_IMAGE_ARM64 }}:${{ env.WORKFLOW_TAG }}
          PUSH_REGISTRY: ${{ needs.config.outputs.can_primary }}
          PUSH_ALIYUN: ${{ needs.config.outputs.can_aliyun }}
        run: |
          set -euo pipefail
          tags=()
          [[ "$PUSH_REGISTRY" == true ]] && tags+=(--tag "$TARGET_IMAGE")
          [[ "$PUSH_ALIYUN" == true ]] && tags+=(--tag "$ALIYUN_IMAGE")
          ((${#tags[@]} > 0)) || { echo 'enable push_registry or push_aliyun' >&2; exit 1; }
          docker buildx build --platform "${{ matrix.platform }}" "${tags[@]}" --push .

  package:
    needs: [config, build]
    if: ${{ always() && needs.config.outputs.can_package == 'true' && (github.event_name == 'push' && needs.build.result == 'success' || github.event_name != 'push' && (inputs.operation == 'release' || needs.build.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login to registry
        if: ${{ needs.config.outputs.can_primary == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Login to Aliyun registry
        if: ${{ needs.config.outputs.can_aliyun == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
      - name: Package image
        env:
          TARGET_IMAGE: ${{ matrix.architecture == 'amd64' && env.WORKFLOW_TARGET_IMAGE_AMD64 || env.WORKFLOW_TARGET_IMAGE_ARM64 }}:${{ env.WORKFLOW_TAG }}
          ALIYUN_IMAGE: ${{ matrix.architecture == 'amd64' && env.WORKFLOW_ALIYUN_IMAGE_AMD64 || env.WORKFLOW_ALIYUN_IMAGE_ARM64 }}:${{ env.WORKFLOW_TAG }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORMS: ${{ env.WORKFLOW_PLATFORMS }}
          PUSH_REGISTRY: ${{ needs.config.outputs.can_primary }}
          PUSH_ALIYUN: ${{ needs.config.outputs.can_aliyun }}
          BUILD_IMAGE: ${{ env.WORKFLOW_BUILD_IMAGE }}
        run: |
          set -euo pipefail
          [[ "$PLATFORMS" == *linux/amd64* && "$PLATFORMS" == *linux/arm64* ]] || {
            echo 'platforms must include linux/amd64 and linux/arm64' >&2
            exit 1
          }
          if [[ "$PUSH_REGISTRY" == true ]]; then
            package_image="$TARGET_IMAGE"
          elif [[ "$PUSH_ALIYUN" == true ]]; then
            package_image="$ALIYUN_IMAGE"
          else
            echo 'enable push_registry or push_aliyun to create a release' >&2
            exit 1
          fi
          mkdir -p release-assets
          docker pull --platform "linux/${ARCHITECTURE}" "$package_image"
          actual="$(docker image inspect "$package_image" --format '{{.Architecture}}')"
          test "$actual" = "$ARCHITECTURE"
          archive="release-assets/hap-promtail-vlogs-mongodb_${{ env.WORKFLOW_TAG }}_${ARCHITECTURE}.tar.gz"
          docker save "$package_image" | gzip -9 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: ${{ always() && needs.config.outputs.can_release == 'true' && needs.package.result == 'success' }}
    needs: [config, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create release manifest
        env:
          TARGET_IMAGE_AMD64: ${{ env.WORKFLOW_TARGET_IMAGE_AMD64 }}:${{ env.WORKFLOW_TAG }}
          TARGET_IMAGE_ARM64: ${{ env.WORKFLOW_TARGET_IMAGE_ARM64 }}:${{ env.WORKFLOW_TAG }}
          ALIYUN_IMAGE_AMD64: ${{ env.WORKFLOW_ALIYUN_IMAGE_AMD64 }}:${{ env.WORKFLOW_TAG }}
          ALIYUN_IMAGE_ARM64: ${{ env.WORKFLOW_ALIYUN_IMAGE_ARM64 }}:${{ env.WORKFLOW_TAG }}
          PLATFORMS: ${{ env.WORKFLOW_PLATFORMS }}
          PUSH_REGISTRY: ${{ needs.config.outputs.can_primary }}
          PUSH_ALIYUN: ${{ needs.config.outputs.can_aliyun }}
          BUILD_IMAGE: ${{ env.WORKFLOW_BUILD_IMAGE }}
          RELEASE_TAG: ${{ env.WORKFLOW_TAG }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os
          files = [p for p in glob.glob('release-assets/*.tar.gz')]
          images = []
          primary = {'amd64': os.environ['TARGET_IMAGE_AMD64'], 'arm64': os.environ['TARGET_IMAGE_ARM64']}
          aliyun = {'amd64': os.environ['ALIYUN_IMAGE_AMD64'], 'arm64': os.environ['ALIYUN_IMAGE_ARM64']}
          for path in sorted(files):
              arch = path.rsplit('_', 1)[1].removesuffix('.tar.gz')
              image = primary[arch] if os.environ['PUSH_REGISTRY'] == 'true' else aliyun[arch]
              images.append({'architecture': arch, 'platform': f'linux/{arch}', 'image': image, 'archive': os.path.basename(path), 'sha256': hashlib.sha256(open(path, 'rb').read()).hexdigest()})
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}"
          for item in images:
              item['download_url'] = f"{base}/{item['archive']}"
          published = []
          if os.environ['PUSH_REGISTRY'] == 'true': published.extend(primary.values())
          if os.environ['PUSH_ALIYUN'] == 'true': published.extend(aliyun.values())
          json.dump({'event': 'image_release_ready', 'release_tag': os.environ['RELEASE_TAG'], 'image': images[0]['image'] if images else '', 'published_images': published, 'platforms': os.environ['PLATFORMS'].split(','), 'images': images}, open('release-assets/release-manifest.json', 'w'), indent=2)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.WORKFLOW_TAG }}
          name: ${{ env.WORKFLOW_TAG }}
          generate_release_notes: true
          files: release-assets/*
      - name: Notify HAP Webhook
        if: ${{ env.WORKFLOW_NOTIFY_HAP == 'true' && env.HAP_WEBHOOK_URL != '' }}
        run: |
          headers=(-H 'Content-Type: application/json')
          [[ -z "${HAP_WEBHOOK_APP_KEY:-}" ]] || headers+=(-H "AppKey: $HAP_WEBHOOK_APP_KEY")
          [[ -z "${HAP_WEBHOOK_SIGN:-}" ]] || headers+=(-H "Sign: $HAP_WEBHOOK_SIGN")
          curl --fail-with-body --retry 2 --connect-timeout 10 --max-time 60 -sS -X POST "$HAP_WEBHOOK_URL" "${headers[@]}" --data-binary @release-assets/release-manifest.json
