name: Image Make

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: build, release, or build-and-release
        required: true
        default: build-and-release
        type: choice
        options: [build, release, build-and-release]
      tag:
        description: Image tag and GitHub Release tag
        required: true
        default: 1.0.0
        type: string
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64
        type: string
      build_image:
        description: Build the Docker image
        required: true
        default: true
        type: boolean
      target_image_amd64:
        description: Primary amd64 image name without tag
        required: true
        default: registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-promtail-vlogs-mongodb-amd64
        type: string
      target_image_arm64:
        description: Primary arm64 image name without tag
        required: true
        default: registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-promtail-vlogs-mongodb-arm64
        type: string
      push_registry:
        description: Push image to the primary registry
        required: true
        default: true
        type: boolean
      push_aliyun:
        description: Push image to the Aliyun registry
        required: true
        default: false
        type: boolean
      aliyun_namespace:
        description: Aliyun namespace used to derive the target image
        required: true
        default: hap-mdy
        type: string
      aliyun_image_amd64:
        description: Aliyun amd64 image name without tag
        required: true
        default: ''
        type: string
      aliyun_image_arm64:
        description: Aliyun arm64 image name without tag
        required: true
        default: ''
        type: string
      create_release:
        description: Create GitHub Release packages
        required: true
        default: true
        type: boolean
      notify_hap:
        description: Notify HAP Webhook after Release
        required: true
        default: false
        type: boolean

env:
  WORKFLOW_OPERATION: ${{ github.event_name == 'push' && 'build-and-release' || inputs.operation }}
  WORKFLOW_TAG: ${{ github.event_name == 'push' && (vars.IMAGE_TAG || '1.0.0') || inputs.tag }}
  WORKFLOW_PLATFORMS: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || inputs.platforms }}
  WORKFLOW_TARGET_IMAGE_AMD64: ${{ github.event_name == 'push' && 'registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-promtail-vlogs-mongodb-amd64' || inputs.target_image_amd64 }}
  WORKFLOW_TARGET_IMAGE_ARM64: ${{ github.event_name == 'push' && 'registry.cn-hangzhou.aliyuncs.com/hap-mdy/hap-promtail-vlogs-mongodb-arm64' || inputs.target_image_arm64 }}
  WORKFLOW_ALIYUN_IMAGE_AMD64: ${{ github.event_name == 'push' && '' || inputs.aliyun_image_amd64 }}
  WORKFLOW_ALIYUN_IMAGE_ARM64: ${{ github.event_name == 'push' && '' || inputs.aliyun_image_arm64 }}
  WORKFLOW_ALIYUN_NAMESPACE: ${{ github.event_name == 'push' && 'hap-mdy' || inputs.aliyun_namespace }}
  WORKFLOW_BUILD_IMAGE: ${{ github.event_name == 'push' && 'true' || inputs.build_image }}
  WORKFLOW_PUSH_REGISTRY: ${{ github.event_name == 'push' && 'true' || inputs.push_registry }}
  WORKFLOW_PUSH_ALIYUN: ${{ github.event_name == 'push' && 'true' || inputs.push_aliyun }}
  WORKFLOW_CREATE_RELEASE: ${{ github.event_name == 'push' && 'true' || inputs.create_release }}
  WORKFLOW_NOTIFY_HAP: ${{ github.event_name == 'push' && 'true' || inputs.notify_hap }}
  REGISTRY: ${{ vars.REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || secrets.ALIYUN_REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.ALIYUN_REGISTRY_PASSWORD }}
  HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
  HAP_WEBHOOK_APP_KEY: ${{ secrets.HAP_WEBHOOK_APP_KEY }}
  HAP_WEBHOOK_SIGN: ${{ secrets.HAP_WEBHOOK_SIGN }}
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  config:
    name: Check module configuration
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      target_image_amd64: ${{ steps.check.outputs.target_image_amd64 }}
      target_image_arm64: ${{ steps.check.outputs.target_image_arm64 }}
      aliyun_image_amd64: ${{ steps.check.outputs.aliyun_image_amd64 }}
      aliyun_image_arm64: ${{ steps.check.outputs.aliyun_image_arm64 }}
      aliyun_registry: ${{ steps.check.outputs.aliyun_registry }}
      aliyun_namespace: ${{ steps.check.outputs.aliyun_namespace }}
      build_enabled: ${{ steps.check.outputs.build_enabled }}
      aliyun_push_enabled: ${{ steps.check.outputs.aliyun_push_enabled }}
      release_enabled: ${{ steps.check.outputs.release_enabled }}
      hap_enabled: ${{ steps.check.outputs.hap_enabled }}
      dockerfile: ${{ steps.check.outputs.dockerfile }}
      docker_context: ${{ steps.check.outputs.docker_context }}
      can_primary: ${{ steps.check.outputs.can_primary }}
      can_aliyun: ${{ steps.check.outputs.can_aliyun }}
      can_build: ${{ steps.check.outputs.can_build }}
      can_package: ${{ steps.check.outputs.can_package }}
      can_release: ${{ steps.check.outputs.can_release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          CONFIG_FILE: .image-build.env
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET_IMAGE_AMD64: ${{ inputs.target_image_amd64 }}
          INPUT_TARGET_IMAGE_ARM64: ${{ inputs.target_image_arm64 }}
          INPUT_ALIYUN_NAMESPACE: ${{ inputs.aliyun_namespace }}
          INPUT_ALIYUN_IMAGE_AMD64: ${{ inputs.aliyun_image_amd64 }}
          INPUT_ALIYUN_IMAGE_ARM64: ${{ inputs.aliyun_image_arm64 }}
          INPUT_BUILD_IMAGE: ${{ inputs.build_image }}
          INPUT_PUSH_ALIYUN: ${{ inputs.push_aliyun }}
          INPUT_CREATE_RELEASE: ${{ inputs.create_release }}
          INPUT_NOTIFY_HAP: ${{ inputs.notify_hap }}
          VAR_IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          VAR_TARGET_IMAGE_AMD64: ${{ vars.TARGET_IMAGE_AMD64 }}
          VAR_TARGET_IMAGE_ARM64: ${{ vars.TARGET_IMAGE_ARM64 }}
          VAR_ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          VAR_ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          VAR_ALIYUN_IMAGE_AMD64: ${{ vars.ALIYUN_IMAGE_AMD64 }}
          VAR_ALIYUN_IMAGE_ARM64: ${{ vars.ALIYUN_IMAGE_ARM64 }}
          VAR_ENABLE_BUILD: ${{ vars.ENABLE_BUILD }}
          VAR_ENABLE_ALIYUN_PUSH: ${{ vars.ENABLE_ALIYUN_PUSH }}
          VAR_ENABLE_RELEASE: ${{ vars.ENABLE_RELEASE }}
          VAR_ENABLE_HAP_WEBHOOK: ${{ vars.ENABLE_HAP_WEBHOOK }}
          REGISTRY: ${{ env.REGISTRY }}
          ALIYUN_REGISTRY: ${{ env.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
          ALIYUN_NAMESPACE: ${{ env.WORKFLOW_ALIYUN_NAMESPACE }}
          TARGET_IMAGE_AMD64: ${{ env.WORKFLOW_TARGET_IMAGE_AMD64 }}
          TARGET_IMAGE_ARM64: ${{ env.WORKFLOW_TARGET_IMAGE_ARM64 }}
          ALIYUN_IMAGE_AMD64: ${{ env.WORKFLOW_ALIYUN_IMAGE_AMD64 }}
          ALIYUN_IMAGE_ARM64: ${{ env.WORKFLOW_ALIYUN_IMAGE_ARM64 }}
          PUSH_REGISTRY: ${{ env.WORKFLOW_PUSH_REGISTRY }}
          PUSH_ALIYUN: ${{ env.WORKFLOW_PUSH_ALIYUN }}
          BUILD_IMAGE: ${{ env.WORKFLOW_BUILD_IMAGE }}
          CREATE_RELEASE: ${{ env.WORKFLOW_CREATE_RELEASE }}
          OPERATION: ${{ env.WORKFLOW_OPERATION }}
          HAP_WEBHOOK_URL: ${{ env.HAP_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import os

          config = {}
          if os.path.exists(os.environ['CONFIG_FILE']):
              for raw in open(os.environ['CONFIG_FILE'], encoding='utf-8'):
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  config[key.strip()] = value.strip().strip('"\'')

          def value(key, input_key=None, var_key=None, default=''):
              if os.environ.get('EVENT_NAME') != 'push' and input_key and os.environ.get(input_key, '').strip():
                  return os.environ[input_key].strip()
              if var_key and os.environ.get(var_key, '').strip():
                  return os.environ[var_key].strip()
              return config.get(key, default).strip()

          tag = value('IMAGE_TAG', 'INPUT_TAG', 'VAR_IMAGE_TAG', '1.0.0')
          target_amd64 = value('TARGET_IMAGE_AMD64', 'INPUT_TARGET_IMAGE_AMD64', 'VAR_TARGET_IMAGE_AMD64')
          target_arm64 = value('TARGET_IMAGE_ARM64', 'INPUT_TARGET_IMAGE_ARM64', 'VAR_TARGET_IMAGE_ARM64')
          aliyun_namespace = value('ALIYUN_NAMESPACE', 'INPUT_ALIYUN_NAMESPACE', 'VAR_ALIYUN_NAMESPACE', 'hap-mdy')
          aliyun_registry = value('ALIYUN_REGISTRY', None, 'VAR_ALIYUN_REGISTRY', 'registry.cn-hangzhou.aliyuncs.com')
          aliyun_image_amd64 = value('ALIYUN_IMAGE_AMD64', 'INPUT_ALIYUN_IMAGE_AMD64', 'VAR_ALIYUN_IMAGE_AMD64')
          aliyun_image_arm64 = value('ALIYUN_IMAGE_ARM64', 'INPUT_ALIYUN_IMAGE_ARM64', 'VAR_ALIYUN_IMAGE_ARM64')
          dockerfile = config.get('DOCKERFILE', 'Dockerfile').strip()
          docker_context = config.get('DOCKER_CONTEXT', '.').strip()
          build_enabled = value('ENABLE_BUILD', 'INPUT_BUILD_IMAGE', 'VAR_ENABLE_BUILD', 'true').lower() == 'true'
          aliyun_push_enabled = value('ENABLE_ALIYUN_PUSH', 'INPUT_PUSH_ALIYUN', 'VAR_ENABLE_ALIYUN_PUSH', 'true').lower() == 'true'
          release_enabled = value('ENABLE_RELEASE', 'INPUT_CREATE_RELEASE', 'VAR_ENABLE_RELEASE', 'true').lower() == 'true'
          hap_enabled = value('ENABLE_HAP_WEBHOOK', 'INPUT_NOTIFY_HAP', 'VAR_ENABLE_HAP_WEBHOOK', 'true').lower() == 'true'
          os.environ['TARGET_IMAGE_AMD64'] = target_amd64
          os.environ['TARGET_IMAGE_ARM64'] = target_arm64
          os.environ['ALIYUN_NAMESPACE'] = aliyun_namespace
          os.environ['ALIYUN_REGISTRY'] = aliyun_registry
          os.environ['ALIYUN_IMAGE_AMD64'] = aliyun_image_amd64
          os.environ['ALIYUN_IMAGE_ARM64'] = aliyun_image_arm64
          os.environ['BUILD_IMAGE'] = str(build_enabled).lower()
          os.environ['PUSH_ALIYUN'] = str(aliyun_push_enabled).lower()
          os.environ['CREATE_RELEASE'] = str(release_enabled).lower()

          def enabled(name):
              return os.environ.get(name, '').lower() == 'true'

          primary = all(os.environ.get(k, '').strip() for k in ('TARGET_IMAGE_AMD64', 'TARGET_IMAGE_ARM64'))
          aliyun = enabled('PUSH_ALIYUN') and all(os.environ.get(k, '').strip() for k in ('ALIYUN_REGISTRY', 'ALIYUN_NAMESPACE', 'ALIYUN_USERNAME', 'ALIYUN_PASSWORD', 'TARGET_IMAGE_AMD64', 'TARGET_IMAGE_ARM64'))
          source = primary or aliyun
          can_build = enabled('BUILD_IMAGE') and source
          can_package = enabled('CREATE_RELEASE') and (aliyun if os.environ.get('OPERATION') == 'release' else can_build)
          can_release = can_package
          reasons = []
          primary_missing = [k for k in ('TARGET_IMAGE_AMD64', 'TARGET_IMAGE_ARM64') if not os.environ.get(k, '').strip()]
          aliyun_missing = [k for k in ('ALIYUN_REGISTRY', 'ALIYUN_NAMESPACE', 'ALIYUN_USERNAME', 'ALIYUN_PASSWORD') if not os.environ.get(k, '').strip()]
          if enabled('PUSH_REGISTRY') and not primary:
              reasons.append('Local build skipped; missing: ' + ', '.join(primary_missing))
          if enabled('PUSH_ALIYUN') and not aliyun:
              reasons.append('Aliyun registry skipped; missing: ' + ', '.join(aliyun_missing))
          if not source:
              reasons.append('Build/package skipped: no usable image registry is configured.')
          if enabled('CREATE_RELEASE') and source:
              reasons.append('GitHub Release: enabled.')
          if os.environ.get('HAP_WEBHOOK_URL', '').strip():
              reasons.append('HAP Webhook: configured and will be notified after Release.')
          else:
              reasons.append('HAP Webhook skipped: HAP_WEBHOOK_URL is missing.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Module configuration\n\n')
              f.write('\n'.join(f'- {item}' for item in reasons) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'tag={tag}\n')
              f.write(f'target_image_amd64={target_amd64}\n')
              f.write(f'target_image_arm64={target_arm64}\n')
              f.write(f'aliyun_image_amd64={aliyun_image_amd64}\n')
              f.write(f'aliyun_image_arm64={aliyun_image_arm64}\n')
              f.write(f'aliyun_registry={aliyun_registry}\n')
              f.write(f'aliyun_namespace={aliyun_namespace}\n')
              f.write(f'build_enabled={str(build_enabled).lower()}\n')
              f.write(f'aliyun_push_enabled={str(aliyun_push_enabled).lower()}\n')
              f.write(f'release_enabled={str(release_enabled).lower()}\n')
              f.write(f'hap_enabled={str(hap_enabled).lower()}\n')
              f.write(f'dockerfile={dockerfile}\n')
              f.write(f'docker_context={docker_context}\n')
              f.write(f'can_primary={str(primary).lower()}\n')
              f.write(f'can_aliyun={str(aliyun).lower()}\n')
              f.write(f'can_build={str(can_build).lower()}\n')
              f.write(f'can_package={str(can_package).lower()}\n')
              f.write(f'can_release={str(can_release).lower()}\n')
          PY

  build:
    needs: config
    if: ${{ needs.config.outputs.can_build == 'true' && (github.event_name == 'push' || inputs.operation != 'release') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun registry
        if: ${{ needs.config.outputs.can_aliyun == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.config.outputs.aliyun_registry }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
      - name: Build and push architecture image
        env:
          TARGET_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.target_image_amd64 || needs.config.outputs.target_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.aliyun_image_amd64 || needs.config.outputs.aliyun_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_REGISTRY: ${{ needs.config.outputs.aliyun_registry }}
          ALIYUN_NAMESPACE: ${{ needs.config.outputs.aliyun_namespace }}
          PUSH_ALIYUN: ${{ needs.config.outputs.can_aliyun }}
        run: |
          set -euo pipefail
          docker buildx build --platform "${{ matrix.platform }}" --build-arg TARGETARCH="${{ matrix.architecture }}" --file "${{ needs.config.outputs.dockerfile }}" --tag "$TARGET_IMAGE" --load "${{ needs.config.outputs.docker_context }}"
          if [[ "$PUSH_ALIYUN" == true ]]; then
            if [[ -z "$ALIYUN_IMAGE" || "$ALIYUN_IMAGE" == ":${TARGET_IMAGE##*:}" ]]; then
              image_name="${TARGET_IMAGE%:*}"
              image_name="${image_name##*/}"
              ALIYUN_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${image_name}:${TARGET_IMAGE##*:}"
            fi
            docker tag "$TARGET_IMAGE" "$ALIYUN_IMAGE"
            docker push "$ALIYUN_IMAGE"
          fi
      - name: Package locally built image
        if: ${{ needs.config.outputs.release_enabled == 'true' }}
        env:
          TARGET_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.target_image_amd64 || needs.config.outputs.target_image_arm64 }}:${{ needs.config.outputs.tag }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          archive="release-assets/hap-promtail-vlogs-mongodb_${{ needs.config.outputs.tag }}_${ARCHITECTURE}.tar.gz"
          docker save "$TARGET_IMAGE" | gzip -9 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - name: Upload locally built image package
        if: ${{ needs.config.outputs.release_enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  package:
    needs: [config, build]
    if: ${{ always() && needs.config.outputs.can_package == 'true' && github.event_name != 'push' && inputs.operation == 'release' && needs.build.result == 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun registry
        if: ${{ needs.config.outputs.can_aliyun == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.config.outputs.aliyun_registry }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
      - name: Package image
        env:
          TARGET_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.target_image_amd64 || needs.config.outputs.target_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.aliyun_image_amd64 || needs.config.outputs.aliyun_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_REGISTRY: ${{ needs.config.outputs.aliyun_registry }}
          ALIYUN_NAMESPACE: ${{ needs.config.outputs.aliyun_namespace }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORMS: ${{ env.WORKFLOW_PLATFORMS }}
          PUSH_ALIYUN: ${{ needs.config.outputs.can_aliyun }}
          BUILD_IMAGE: ${{ needs.config.outputs.build_enabled }}
        run: |
          set -euo pipefail
          [[ "$PLATFORMS" == *linux/amd64* && "$PLATFORMS" == *linux/arm64* ]] || {
            echo 'platforms must include linux/amd64 and linux/arm64' >&2
            exit 1
          }
          [[ "$PUSH_ALIYUN" == true ]] || { echo 'Aliyun image is required for release-only mode' >&2; exit 1; }
          if [[ -z "$ALIYUN_IMAGE" || "$ALIYUN_IMAGE" == ":${TARGET_IMAGE##*:}" ]]; then
            image_name="${TARGET_IMAGE%:*}"
            image_name="${image_name##*/}"
            ALIYUN_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${image_name}:${TARGET_IMAGE##*:}"
          fi
          package_image="$ALIYUN_IMAGE"
          mkdir -p release-assets
          docker pull --platform "linux/${ARCHITECTURE}" "$package_image"
          actual="$(docker image inspect "$package_image" --format '{{.Architecture}}')"
          test "$actual" = "$ARCHITECTURE"
          archive="release-assets/hap-promtail-vlogs-mongodb_${{ needs.config.outputs.tag }}_${ARCHITECTURE}.tar.gz"
          docker save "$package_image" | gzip -9 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: ${{ always() && needs.config.outputs.can_release == 'true' && ((github.event_name == 'push' && needs.build.result == 'success') || (github.event_name != 'push' && ((inputs.operation == 'build-and-release' && needs.build.result == 'success') || (inputs.operation == 'release' && needs.package.result == 'success')))) }}
    needs: [config, build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create release manifest
        env:
          TARGET_IMAGE_AMD64: ${{ needs.config.outputs.target_image_amd64 }}:${{ needs.config.outputs.tag }}
          TARGET_IMAGE_ARM64: ${{ needs.config.outputs.target_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_IMAGE_AMD64: ${{ needs.config.outputs.aliyun_image_amd64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_IMAGE_ARM64: ${{ needs.config.outputs.aliyun_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_REGISTRY: ${{ needs.config.outputs.aliyun_registry }}
          ALIYUN_NAMESPACE: ${{ needs.config.outputs.aliyun_namespace }}
          PLATFORMS: ${{ env.WORKFLOW_PLATFORMS }}
          PUSH_REGISTRY: ${{ needs.config.outputs.can_primary }}
          PUSH_ALIYUN: ${{ needs.config.outputs.can_aliyun }}
          BUILD_IMAGE: ${{ needs.config.outputs.build_enabled }}
          RELEASE_TAG: ${{ needs.config.outputs.tag }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os
          files = [p for p in glob.glob('release-assets/*.tar.gz')]
          images = []
          primary = {'amd64': os.environ['TARGET_IMAGE_AMD64'], 'arm64': os.environ['TARGET_IMAGE_ARM64']}
          aliyun = {'amd64': os.environ['ALIYUN_IMAGE_AMD64'], 'arm64': os.environ['ALIYUN_IMAGE_ARM64']}
          for arch in aliyun:
              if not aliyun[arch] or aliyun[arch] == ':' + os.environ['RELEASE_TAG']:
                  local_name = primary[arch].rsplit('/', 1)[-1].rsplit(':', 1)[0]
                  aliyun[arch] = f"{os.environ['ALIYUN_REGISTRY']}/{os.environ['ALIYUN_NAMESPACE']}/{local_name}:{os.environ['RELEASE_TAG']}"
          for path in sorted(files):
              arch = path.rsplit('_', 1)[1].removesuffix('.tar.gz')
              image = aliyun[arch] if os.environ['PUSH_ALIYUN'] == 'true' else primary[arch]
              images.append({'architecture': arch, 'platform': f'linux/{arch}', 'image': image, 'archive': os.path.basename(path), 'sha256': hashlib.sha256(open(path, 'rb').read()).hexdigest()})
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}"
          for item in images:
              item['download_url'] = f"{base}/{item['archive']}"
          published = []
          if os.environ['PUSH_REGISTRY'] == 'true': published.extend(primary.values())
          if os.environ['PUSH_ALIYUN'] == 'true': published.extend(aliyun.values())
          json.dump({'event': 'image_release_ready', 'release_tag': os.environ['RELEASE_TAG'], 'image': images[0]['image'] if images else '', 'published_images': published, 'platforms': os.environ['PLATFORMS'].split(','), 'images': images}, open('release-assets/release-manifest.json', 'w'), indent=2)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.config.outputs.tag }}
          name: ${{ needs.config.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
      - name: Notify HAP Webhook
        if: ${{ needs.config.outputs.hap_enabled == 'true' && env.HAP_WEBHOOK_URL != '' }}
        run: |
          headers=(-H 'Content-Type: application/json')
          [[ -z "${HAP_WEBHOOK_APP_KEY:-}" ]] || headers+=(-H "AppKey: $HAP_WEBHOOK_APP_KEY")
          [[ -z "${HAP_WEBHOOK_SIGN:-}" ]] || headers+=(-H "Sign: $HAP_WEBHOOK_SIGN")
          curl --fail-with-body --retry 2 --connect-timeout 10 --max-time 60 -sS -X POST "$HAP_WEBHOOK_URL" "${headers[@]}" --data-binary @release-assets/release-manifest.json
