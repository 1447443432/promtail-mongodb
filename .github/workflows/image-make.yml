name: Image Make

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: build, release, or build-and-release
        required: true
        default: build-and-release
        type: choice
        options: [build, release, build-and-release]
      tag:
        description: Image tag and GitHub Release tag
        required: true
        default: 1.0.0
        type: string
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64
        type: string
      build_image:
        description: Build the Docker image
        required: true
        default: true
        type: boolean
      target_image_amd64:
        description: Primary amd64 image name without tag
        required: false
        default: ''
        type: string
      target_image_arm64:
        description: Primary arm64 image name without tag
        required: false
        default: ''
        type: string
      push_aliyun:
        description: Push image to the Aliyun registry
        required: true
        default: false
        type: boolean
      aliyun_namespace:
        description: Aliyun namespace used to derive the target image
        required: false
        default: ''
        type: string
      aliyun_image_amd64:
        description: Optional Aliyun amd64 image name without tag
        required: true
        default: ''
        type: string
      aliyun_image_arm64:
        description: Optional Aliyun arm64 image name without tag
        required: true
        default: ''
        type: string
      create_release:
        description: Create GitHub Release packages
        required: true
        default: true
        type: boolean
      notify_hap:
        description: Notify HAP Webhook after Release
        required: true
        default: false
        type: boolean

env:
  WORKFLOW_OPERATION: ${{ github.event_name == 'push' && 'build-and-release' || inputs.operation }}
  WORKFLOW_PLATFORMS: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || inputs.platforms }}
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || secrets.ALIYUN_REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.ALIYUN_REGISTRY_PASSWORD }}
  HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
  HAP_WEBHOOK_APP_KEY: ${{ secrets.HAP_WEBHOOK_APP_KEY }}
  HAP_WEBHOOK_SIGN: ${{ secrets.HAP_WEBHOOK_SIGN }}
  BASE_REGISTRY_USERNAME: ${{ secrets.BASE_REGISTRY_USERNAME }}
  BASE_REGISTRY_PASSWORD: ${{ secrets.BASE_REGISTRY_PASSWORD }}
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
  ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  config:
    name: Check module configuration
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release_name: ${{ steps.check.outputs.release_name }}
      platforms: ${{ steps.check.outputs.platforms }}
      target_image_amd64: ${{ steps.check.outputs.target_image_amd64 }}
      target_image_arm64: ${{ steps.check.outputs.target_image_arm64 }}
      aliyun_image_amd64: ${{ steps.check.outputs.aliyun_image_amd64 }}
      aliyun_image_arm64: ${{ steps.check.outputs.aliyun_image_arm64 }}
      aliyun_registry: ${{ steps.check.outputs.aliyun_registry }}
      aliyun_namespace: ${{ steps.check.outputs.aliyun_namespace }}
      build_enabled: ${{ steps.check.outputs.build_enabled }}
      aliyun_push_enabled: ${{ steps.check.outputs.aliyun_push_enabled }}
      release_enabled: ${{ steps.check.outputs.release_enabled }}
      hap_enabled: ${{ steps.check.outputs.hap_enabled }}
      dockerfile: ${{ steps.check.outputs.dockerfile }}
      build_context: ${{ steps.check.outputs.build_context }}
      alpine_mirror: ${{ steps.check.outputs.alpine_mirror }}
      alpine_version: ${{ steps.check.outputs.alpine_version }}
      base_image_amd64: ${{ steps.check.outputs.base_image_amd64 }}
      base_image_arm64: ${{ steps.check.outputs.base_image_arm64 }}
      can_primary: ${{ steps.check.outputs.can_primary }}
      can_aliyun: ${{ steps.check.outputs.can_aliyun }}
      can_build: ${{ steps.check.outputs.can_build }}
      can_package: ${{ steps.check.outputs.can_package }}
      can_release: ${{ steps.check.outputs.can_release }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        env:
          CONFIG_FILE: .image-build.env
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET_IMAGE_AMD64: ${{ inputs.target_image_amd64 }}
          INPUT_TARGET_IMAGE_ARM64: ${{ inputs.target_image_arm64 }}
          INPUT_ALIYUN_NAMESPACE: ${{ inputs.aliyun_namespace }}
          INPUT_ALIYUN_IMAGE_AMD64: ${{ inputs.aliyun_image_amd64 }}
          INPUT_ALIYUN_IMAGE_ARM64: ${{ inputs.aliyun_image_arm64 }}
          INPUT_BUILD_IMAGE: ${{ inputs.build_image }}
          INPUT_PUSH_ALIYUN: ${{ inputs.push_aliyun }}
          INPUT_CREATE_RELEASE: ${{ inputs.create_release }}
          INPUT_NOTIFY_HAP: ${{ inputs.notify_hap }}
          VAR_IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          VAR_RELEASE_NAME: ${{ vars.RELEASE_NAME }}
          VAR_BASE_IMAGE_AMD64: ${{ vars.BASE_IMAGE_AMD64 }}
          VAR_BASE_IMAGE_ARM64: ${{ vars.BASE_IMAGE_ARM64 }}
          VAR_TARGET_IMAGE_AMD64: ${{ vars.TARGET_IMAGE_AMD64 }}
          VAR_TARGET_IMAGE_ARM64: ${{ vars.TARGET_IMAGE_ARM64 }}
          VAR_ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          VAR_ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          VAR_ALIYUN_IMAGE_AMD64: ${{ vars.ALIYUN_IMAGE_AMD64 }}
          VAR_ALIYUN_IMAGE_ARM64: ${{ vars.ALIYUN_IMAGE_ARM64 }}
          VAR_ENABLE_BUILD: ${{ vars.ENABLE_BUILD }}
          VAR_ENABLE_ALIYUN_PUSH: ${{ vars.ENABLE_ALIYUN_PUSH }}
          VAR_ENABLE_RELEASE: ${{ vars.ENABLE_RELEASE }}
          VAR_ENABLE_HAP_WEBHOOK: ${{ vars.ENABLE_HAP_WEBHOOK }}
          ALIYUN_USERNAME: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
          ALIYUN_REGISTRY: ${{ env.ALIYUN_REGISTRY }}
          OPERATION: ${{ env.WORKFLOW_OPERATION }}
          WORKFLOW_PLATFORMS: ${{ env.WORKFLOW_PLATFORMS }}
          HAP_WEBHOOK_URL: ${{ env.HAP_WEBHOOK_URL }}
        run: python3 .github/image-make/config.py

  build:
    needs: config
    if: ${{ needs.config.outputs.can_build == 'true' && (github.event_name == 'push' || inputs.operation != 'release') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build architecture image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER: ${{ matrix.runner }}
          TARGET_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.target_image_amd64 || needs.config.outputs.target_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_IMAGE_OVERRIDE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.aliyun_image_amd64 || needs.config.outputs.aliyun_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_REGISTRY: ${{ needs.config.outputs.aliyun_registry }}
          ALIYUN_NAMESPACE: ${{ needs.config.outputs.aliyun_namespace }}
          ALIYUN_USERNAME: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
          BASE_REGISTRY_USERNAME: ${{ env.BASE_REGISTRY_USERNAME }}
          BASE_REGISTRY_PASSWORD: ${{ env.BASE_REGISTRY_PASSWORD }}
          BASE_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.base_image_amd64 || needs.config.outputs.base_image_arm64 }}
          PUSH_ALIYUN: ${{ needs.config.outputs.can_aliyun }}
          RELEASE_ENABLED: ${{ needs.config.outputs.release_enabled }}
          RELEASE_NAME: ${{ needs.config.outputs.release_name }}
          RELEASE_TAG: ${{ needs.config.outputs.tag }}
          DOCKERFILE: ${{ needs.config.outputs.dockerfile }}
          BUILD_CONTEXT: ${{ needs.config.outputs.build_context }}
          ALPINE_MIRROR: ${{ needs.config.outputs.alpine_mirror }}
          ALPINE_VERSION: ${{ needs.config.outputs.alpine_version }}
        run: bash .github/image-make/build.sh
      - name: Upload locally built image package
        if: ${{ needs.config.outputs.release_enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  package:
    needs: [config, build]
    if: ${{ always() && needs.config.outputs.can_package == 'true' && ((github.event_name == 'push' && needs.build.result == 'success') || (github.event_name != 'push' && ((inputs.operation == 'build-and-release' && needs.build.result == 'success') || (inputs.operation == 'release' && needs.build.result == 'skipped')))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download packages from build jobs
        if: ${{ github.event_name == 'push' || inputs.operation == 'build-and-release' }}
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.architecture }}
          path: release-assets
      - name: Package or verify architecture image
        env:
          PACKAGE_MODE: ${{ github.event_name == 'push' && 'verify' || inputs.operation }}
          ARCHITECTURE: ${{ matrix.architecture }}
          TARGET_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.target_image_amd64 || needs.config.outputs.target_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_IMAGE: ${{ matrix.architecture == 'amd64' && needs.config.outputs.aliyun_image_amd64 || needs.config.outputs.aliyun_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_REGISTRY: ${{ needs.config.outputs.aliyun_registry }}
          ALIYUN_NAMESPACE: ${{ needs.config.outputs.aliyun_namespace }}
          ALIYUN_USERNAME: ${{ env.ALIYUN_REGISTRY_USERNAME || env.REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ env.ALIYUN_REGISTRY_PASSWORD || env.REGISTRY_PASSWORD }}
          RELEASE_NAME: ${{ needs.config.outputs.release_name }}
          RELEASE_TAG: ${{ needs.config.outputs.tag }}
        run: bash .github/image-make/package.sh
      - name: Upload release-only package
        if: ${{ github.event_name != 'push' && inputs.operation == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: [config, build, package]
    if: ${{ always() && needs.config.outputs.can_release == 'true' && ((github.event_name == 'push' && needs.build.result == 'success' && needs.package.result == 'success') || (github.event_name != 'push' && ((inputs.operation == 'build-and-release' && needs.build.result == 'success' && needs.package.result == 'success') || (inputs.operation == 'release' && needs.package.result == 'success')))) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create release manifest and summary
        env:
          RELEASE_NAME: ${{ needs.config.outputs.release_name }}
          RELEASE_TAG: ${{ needs.config.outputs.tag }}
          TARGET_IMAGE_AMD64: ${{ needs.config.outputs.target_image_amd64 }}:${{ needs.config.outputs.tag }}
          TARGET_IMAGE_ARM64: ${{ needs.config.outputs.target_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_IMAGE_AMD64: ${{ needs.config.outputs.aliyun_image_amd64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_IMAGE_ARM64: ${{ needs.config.outputs.aliyun_image_arm64 }}:${{ needs.config.outputs.tag }}
          ALIYUN_REGISTRY: ${{ needs.config.outputs.aliyun_registry }}
          ALIYUN_NAMESPACE: ${{ needs.config.outputs.aliyun_namespace }}
          PLATFORMS: ${{ needs.config.outputs.platforms }}
          PUSH_ALIYUN: ${{ needs.config.outputs.can_aliyun }}
          HAP_ENABLED: ${{ needs.config.outputs.hap_enabled }}
          HAP_WEBHOOK_URL: ${{ env.HAP_WEBHOOK_URL }}
        run: python3 .github/image-make/release.py
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.config.outputs.tag }}
          name: ${{ needs.config.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
      - name: Notify HAP Webhook
        if: ${{ needs.config.outputs.hap_enabled == 'true' && env.HAP_WEBHOOK_URL != '' }}
        run: |
          echo "========== HAP Webhook =========="
          echo "[INFO] notifying HAP Webhook..."
          headers=(-H 'Content-Type: application/json')
          [[ -z "${HAP_WEBHOOK_APP_KEY:-}" ]] || headers+=(-H "AppKey: $HAP_WEBHOOK_APP_KEY")
          [[ -z "${HAP_WEBHOOK_SIGN:-}" ]] || headers+=(-H "Sign: $HAP_WEBHOOK_SIGN")
          if curl --fail-with-body --retry 2 --connect-timeout 10 --max-time 60 -sS -X POST "$HAP_WEBHOOK_URL" "${headers[@]}" --data-binary @release-assets/release-manifest.json; then
            echo "[OK] HAP Webhook"
          else
            echo "[ERROR] HAP Webhook failed"
            exit 1
          fi
